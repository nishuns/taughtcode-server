<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Access - ProfileIQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: {{errorDisplay}};
        }

        .error.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>🔒 Documentation Access</h1>
        <p>Please enter the password to access the documentation.</p>
        <form id="loginForm" method="POST">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <button type="submit">Access Documentation</button>
            <div class="error" id="error">{{errorMessage}}</div>
        </form>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            try {
                // Use URLSearchParams for application/x-www-form-urlencoded
                const formData = new URLSearchParams();
                formData.append('password', password);

                const response = await fetch(window.location.pathname, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });

                if (response.ok || response.redirected) {
                    window.location.reload();
                } else {
                    const text = await response.text();
                    // Check if response is HTML (login form with error) or JSON
                    if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
                        // It's the login form with error, extract error message
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');
                        const errorMsg = doc.querySelector('.error');
                        if (errorMsg && errorMsg.textContent.trim()) {
                            errorDiv.textContent = errorMsg.textContent.trim();
                        } else {
                            errorDiv.textContent = 'Invalid password. Please try again.';
                        }
                    } else {
                        try {
                            const data = JSON.parse(text);
                            errorDiv.textContent = data.error || 'Invalid password';
                        } catch {
                            errorDiv.textContent = 'Invalid password';
                        }
                    }
                    errorDiv.style.display = 'block';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>

</html>
