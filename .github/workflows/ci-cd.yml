name: TaughtCode Server CI/CD

on:
  push:
    branches: [ "master", "develop", "deploy" ]
  pull_request:
    branches: [ "master", "develop" ]

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Step 1: Continuous Integration (Quality Checks) ---
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high || true # Informational, don't break yet

      - name: Run Tests
        run: npm test || true # Echoes error but continues as you don't have tests yet

      # Uncomment once you add a linting script (e.g., eslint)
      # - name: Lint Code
      #   run: npm run lint

  # --- Step 2: Continuous Deployment ---
  deploy:
    name: Continuous Deployment
    needs: ci
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        # This is a generic placeholder using SSH. 
        # You will need to add HOST, USERNAME, and SSH_KEY to your GitHub Repo Secrets.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # Navigate to app directory
            cd /var/www/taughtcode-server || exit
            
            # Pull latest changes
            git fetch origin deploy
            git reset --hard origin/deploy
            
            # Install production dependencies
            npm ci --omit=dev
            
            # Run database migrations or other setup if needed
            # npm run migrate
            
            # Restart the server (assuming PM2 is used)
            pm2 restart taughtcode-server --update-env || pm2 start src/server.js --name taughtcode-server
            
            # Verify status
            pm2 status taughtcode-server

      - name: Post-Deployment Health Check
        run: |
          echo "Waiting for server to restart..."
          sleep 10
          # Replace with your actual health check URL
          # curl -f http://${{ secrets.DEPLOY_HOST }}/api/v1/health || exit 1